<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h2>Buscador de Personajes</h2>

<input type="text" id="nombreInput" placeholder="Buscar por nombre">
<select id="tipoInput">
  <option value="">Tipo</option>
  <option value="DPS">DPS</option>
  <option value="Apoyo">Apoyo</option>
  <option value="Defensa">Defensa</option>
</select>
<select id="afinidadInput">
  <option value="">Afinidad</option>
  <option value="Fuego">Fuego</option>
  <option value="Hielo">Hielo</option>
  <option value="Cuántico">Cuántico</option>
</select>
<button id="buscarBtn">Buscar</button>

<div id="personajesContainer"></div>

<script src="js/main.js"></script>

</body>
</html>

<style>
body {
    background: linear-gradient(135deg, #1a2236 0%, #3a3f5a 100%);
    color: #e0e6f8;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
}

h2 {
    text-align: center;
    margin-top: 32px;
    font-size: 2.2rem;
    letter-spacing: 2px;
    color: #ffe066;
    text-shadow: 0 2px 8px #222;
}

input[type="text"], select {
    background: #23284a;
    color: #e0e6f8;
    border: 1px solid #4e5d94;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 6px 16px 0;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
}

input[type="text"]:focus, select:focus {
    border: 1.5px solid #ffe066;
}

#buscarBtn {
    background: linear-gradient(90deg, #ffe066 60%, #f7b801 100%);
    color: #23284a;
    border: none;
    border-radius: 6px;
    padding: 10px 22px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 2px 8px #2224;
    transition: background 0.2s, color 0.2s;
}

#buscarBtn:hover {
    background: linear-gradient(90deg, #f7b801 60%, #ffe066 100%);
    color: #1a2236;
}

#personajesContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    margin: 32px auto 0 auto;
    max-width: 1100px;
}

#personajesContainer > div {
    background: linear-gradient(135deg, #23284a 60%, #2e3350 100%);
    border: 1.5px solid #ffe06655;
    border-radius: 14px;
    box-shadow: 0 4px 18px #0006;
    padding: 24px 20px 18px 20px;
    width: 270px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    transition: transform 0.18s, box-shadow 0.18s;
}

#personajesContainer > div:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 8px 32px #ffe06633, 0 2px 12px #0008;
    border-color: #ffe066;
}

#personajesContainer h3 {
    margin: 0 0 8px 0;
    color: #ffe066;
    font-size: 1.3rem;
    letter-spacing: 1px;
}

#personajesContainer p {
    margin: 4px 0;
    color: #e0e6f8;
    font-size: 1rem;
}

#personajesContainer button {
    margin-top: 10px;
    align-self: flex-end;
    background: #ffe066;
    color: #23284a;
    border: none;
    border-radius: 5px;
    padding: 7px 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
}

#personajesContainer button:hover {
    background: #f7b801;
    color: #1a2236;
}
</style>

<script>

async function cargarPersonajes() {
  const nombre = document.getElementById('nombreInput').value;
  const tipo = document.getElementById('tipoInput').value;
  const afinidad = document.getElementById('afinidadInput').value;

  let url = '/api/personajes?';
  if (nombre) url += `nombre=${encodeURIComponent(nombre)}&`;
  if (tipo) url += `tipo=${encodeURIComponent(tipo)}&`;
  if (afinidad) url += `afinidad=${encodeURIComponent(afinidad)}&`;

  const res = await fetch(url);
  const personajes = await res.json();

  const container = document.getElementById('personajesContainer');
  container.innerHTML = ''; // limpiar

  personajes.forEach(p => {
    const card = document.createElement('div');
    card.innerHTML = `
      <h3>${p.nombre}</h3>
      <p><strong>Tipo:</strong> ${p.tipo}</p>
      <p><strong>Afinidad:</strong> ${p.afinidad}</p>
      <p>${p.descripcion}</p>
      <button onclick="verDetalle(${p.id})">Ver más</button>
    `;
    container.appendChild(card);
  });
}

function verDetalle(id) {
  window.location.href = `personaje.html?id=${id}`;
}

document.getElementById('buscarBtn').addEventListener('click', cargarPersonajes);

// Cargar al inicio
window.onload = cargarPersonajes;


</script>
