<style>

form {

input[type="file"] {

<script>

async function cargarPersonajes() {
  const res = await fetch('/api/personajes');
  const personajes = await res.json();

  const contenedor = document.getElementById('listaPersonajes');
  contenedor.innerHTML = '';

  personajes.forEach(p => {
    const div = document.createElement('div');
    div.innerHTML = `
      <p><strong>${p.nombre}</strong> (${p.tipo} / ${p.afinidad})
      <button onclick="eliminarPersonaje(${p.id})">Eliminar</button></p>
    `;
    contenedor.appendChild(div);
  });
}

const card = document.createElement('div');
card.innerHTML = `
  <h3>${p.nombre}</h3>
  <img src="img/${p.imagen}" width="100">
  <p>${p.tipo} - ${p.afinidad}</p>
  <a href="personaje.html?id=${p.id}">
    <button>Ver más</button>
  </a>
`;


async function eliminarPersonaje(id) {
  if (confirm('¿Estás seguro de eliminar este personaje?')) {
    const res = await fetch(`/api/personajes/${id}`, { method: 'DELETE' });
    const data = await res.json();
    alert(data.message);
    cargarPersonajes();
  }
}

//boton para agregar personajes como admin
document.getElementById('formEditar').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;

  let imagenFinal = form.imagen.value; // valor por defecto (la imagen actual)

  // Si el usuario seleccionó una nueva imagen
  const archivoNuevo = document.getElementById('imgEditUpload').files[0];
  if (archivoNuevo) {
    const formData = new FormData();
    formData.append('imagen', archivoNuevo);

    const uploadRes = await fetch('/api/upload', {
      method: 'POST',
      body: formData
    });

    const uploadData = await uploadRes.json();
    if (!uploadRes.ok) {
      alert(uploadData.message || 'Error al subir la nueva imagen');
      return;
    }

    imagenFinal = uploadData.filename; // se actualiza con el nombre de la nueva imagen
  }

  const personaje = {
    nombre: form.nombre.value,
    tipo: form.tipo.value,
    afinidad: form.afinidad.value,
    imagen: imagenFinal,
    descripcion: form.descripcion.value
  };

  const res = await fetch(`/api/personajes/${form.id.value}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(personaje)
  });

  const data = await res.json();
  alert(data.message);
  form.reset();
  form.style.display = 'none';
  cargarPersonajes();
});

// Verificación de token y rol
document.addEventListener('DOMContentLoaded', () => {
  const token = localStorage.getItem('token');
  const rol = localStorage.getItem('rol');

  if (!token || rol !== 'admin') {
    alert('Acceso no autorizado. Redirigiendo al login...');
    window.location.href = 'login.html';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('token');
  localStorage.removeItem('rol');
  alert('Sesión cerrada');
  window.location.href = 'login.html';
});



</script>
